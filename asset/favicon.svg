<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a14" />
      <stop offset="100%" stop-color="#120b08" />
    </linearGradient>

    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#b05b3b" />
    </linearGradient>

    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fefae0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4a373" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#cupGrad)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="280" r="140" fill="url(#cupGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Steam Waves -->
  <path d="M 200 160 C 180 130, 220 110, 200 80" fill="none" stroke="url(#steamGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 256 150 C 236 120, 276 100, 256 70" fill="none" stroke="url(#steamGrad)" stroke-width="18" stroke-linecap="round" />
  <path d="M 312 160 C 292 130, 332 110, 312 80" fill="none" stroke="url(#steamGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Cup Main Body -->
  <path d="M 140 200 L 372 200 L 348 370 C 344 400, 316 420, 280 420 L 232 420 C 196 420, 168 400, 164 370 Z" fill="url(#cupGrad)" filter="url(#glow)" />

  <!-- Cup Handle -->
  <path d="M 360 230 C 420 230, 430 330, 350 340" fill="none" stroke="url(#cupGrad)" stroke-width="28" stroke-linecap="round" />

  <!-- Liquid Surface Accent -->
  <ellipse cx="256" cy="200" rx="116" ry="18" fill="#fefae0" opacity="0.9" />
</svg>
